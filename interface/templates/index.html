<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Recommender - AI Pipeline</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="bg-gradient-primary">

    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card glass-card shadow-lg p-5" style="max-width: 600px; width: 100%;">
            <div class="text-center mb-5">
                <div class="icon-box mb-3">
                    <i class="fas fa-robot fa-3x text-primary"></i>
                </div>
                <h1 class="fw-bold text-gradient">AI Model Recommender</h1>
                <p class="text-muted">Upload your dataset to automatically find the best ML model.</p>
            </div>

            <form id="uploadForm">
                <!-- File Upload -->
                <div class="mb-4">
                    <label for="csvFile" class="form-label fw-semibold">1. Upload CSV Dataset</label>
                    <div class="file-drop-area" id="dropArea">
                        <i class="fas fa-cloud-upload-alt fa-2x mb-2 text-muted"></i>
                        <span class="file-message">Drag & Drop or Click to Upload</span>
                        <input class="file-input" type="file" id="csvFile" accept=".csv" required>
                    </div>
                    <div id="fileNameDisplay" class="mt-2 text-success small fw-bold"></div>
                </div>

                <!-- Target Column Selection (Hidden initially) -->
                <div class="mb-4 d-none" id="targetSection">
                    <label for="targetColumn" class="form-label fw-semibold">2. Select Target Variable (y)</label>
                    <select class="form-select mb-4" id="targetColumn" name="target_column" required>
                        <option value="" selected disabled>Choose the column to predict...</option>
                    </select>

                    <label class="form-label fw-semibold">3. Choose Models to Train</label>
                    <div class="model-grid p-3 rounded" style="background: rgba(0,0,0,0.05);">
                        <div class="row g-2">
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="models" value="KNN"
                                        id="chkKNN" checked>
                                    <label class="form-check-label small" for="chkKNN">KNN</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="models" value="Random Forest"
                                        id="chkRF" checked>
                                    <label class="form-check-label small" for="chkRF">Random Forest</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="models" value="SVM"
                                        id="chkSVM" checked>
                                    <label class="form-check-label small" for="chkSVM">SVM</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="models" value="Decision Tree"
                                        id="chkDT" checked>
                                    <label class="form-check-label small" for="chkDT">Decision Trees</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="models" value="Linear Regression, Logistic Regression"
                                        id="chkReg" checked>
                                    <label class="form-check-label small" for="chkReg">Linear/Logistic</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="models" value="Naive Bayes"
                                        id="chkNB" checked>
                                    <label class="form-check-label small" for="chkNB">Naive Bayes</label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm hover-elevate"
                    id="submitBtn">
                    <i class="fas fa-rocket me-2"></i> Launch Pipeline
                </button>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="d-none">
        <div class="text-center text-white">
            <div class="spinner-border text-light mb-4" style="width: 4rem; height: 4rem;" role="status"></div>
            <h2 class="fw-bold mb-3">Training AI Models</h2>

            <div class="progress mb-3 mx-auto"
                style="height: 10px; max-width: 400px; background: rgba(255,255,255,0.2);">
                <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                    role="progressbar" style="width: 0%"></div>
            </div>

            <p id="statusMessage" class="lead opacity-75 mb-1">Preparing datasets...</p>
            <p class="small opacity-50">This runs concurrently on all available CPU cores.</p>
        </div>
    </div>

    <!-- Bootstrap JS + Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
