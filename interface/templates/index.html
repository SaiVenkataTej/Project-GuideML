<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Recommender - AI Pipeline</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gradient-primary">

    <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card glass-card shadow-lg p-5" style="max_width: 600px; width: 100%;">
            <div class="text-center mb-5">
                <div class="icon-box mb-3">
                    <i class="fas fa-robot fa-3x text-primary"></i>
                </div>
                <h1 class="fw-bold text-gradient">AI Model Recommender</h1>
                <p class="text-muted">Upload your dataset to automatically find the best ML model.</p>
            </div>

            <form id="uploadForm">
                <!-- File Upload -->
                <div class="mb-4">
                    <label for="csvFile" class="form-label fw-semibold">1. Upload CSV Dataset</label>
                    <div class="file-drop-area" id="dropArea">
                        <i class="fas fa-cloud-upload-alt fa-2x mb-2 text-muted"></i>
                        <span class="file-message">Drag & Drop or Click to Upload</span>
                        <input class="file-input" type="file" id="csvFile" accept=".csv" required>
                    </div>
                    <div id="fileNameDisplay" class="mt-2 text-success small fw-bold"></div>
                </div>

                <!-- Target Column Selection (Hidden initially) -->
                <div class="mb-4 d-none" id="targetSection">
                    <label for="targetColumn" class="form-label fw-semibold">2. Select Target Variable (Y)</label>
                    <select class="form-select" id="targetColumn" name="target_column" required>
                        <option value="" selected disabled>Choose the column to predict...</option>
                    </select>
                </div>

                <!-- Action Button -->
                <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill shadow-sm hover-elevate" id="submitBtn">
                    <i class="fas fa-rocket me-2"></i> Launch Pipeline
                </button>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="d-none">
        <div class="text-center text-white">
            <div class="spinner-border text-light mb-3" style="width: 3rem; height: 3rem;" role="status"></div>
            <h3 class="fw-light">Training Models...</h3>
            <p class="opacity-75">This may take a minute. We are running 7+ algorithms concurrently.</p>
        </div>
    </div>

    <!-- Bootstrap JS + Custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
