<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuideML | Documentation</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            padding-top: 80px;
            padding-bottom: 60px;
        }

        .docs-container {
            max-width: 860px;
            margin: 0 auto;
        }

        .docs-body h1 { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .docs-body h2 { font-size: 1.4rem; font-weight: 600; margin-top: 2.5rem; margin-bottom: 1rem; padding-bottom: 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .docs-body h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.8rem; color: var(--bs-primary, #6ea8fe); }
        .docs-body p  { color: rgba(255,255,255,0.75); line-height: 1.8; margin-bottom: 1rem; }
        .docs-body ul, .docs-body ol { color: rgba(255,255,255,0.75); line-height: 1.9; padding-left: 1.5rem; margin-bottom: 1rem; }
        .docs-body li { margin-bottom: 0.3rem; }
        .docs-body strong { color: #fff; }
        .docs-body hr { border-color: rgba(255,255,255,0.08); margin: 2rem 0; }

        .docs-body pre {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 1.2rem 1.4rem;
            overflow-x: auto;
            margin-bottom: 1.2rem;
        }
        .docs-body code {
            font-size: 0.87rem;
            color: #a8d8a8;
            background: rgba(255,255,255,0.05);
            padding: 0.15em 0.4em;
            border-radius: 4px;
        }
        .docs-body pre code {
            background: transparent;
            padding: 0;
            color: #c9d1d9;
        }

        .docs-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }
        .docs-back-btn:hover { color: #fff; }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg nav-blur fixed-top">
        <div class="container px-4">
            <a class="navbar-brand d-flex align-items-center" href="/">
                <div class="icon-box bg-primary bg-opacity-10 me-3">
                    <i class="fas fa-brain text-primary"></i>
                </div>
                <span class="fw-bold text-white ls-1">GUIDE<span class="text-primary">ML</span></span>
            </a>
            <div class="ms-auto d-none d-md-flex gap-4">
                <a href="/docs" class="text-white text-decoration-none small fw-medium">Documentation</a>
                <a href="#" class="text-white-50 text-decoration-none small fw-medium hover-white transition">Engine v2.1</a>
            </div>
        </div>
    </nav>

    <main class="container docs-container">
        <a href="/" class="docs-back-btn">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>

        <div class="glass-card p-4 p-md-5">
            <div class="docs-body">
                {{ content | safe }}
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
