services:
  - type: web
    name: project-guideml
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir interface app:app --bind 0.0.0.0:$PORT --timeout 300
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
