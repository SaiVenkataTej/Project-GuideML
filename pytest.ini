[pytest]
# ──────────────────────────────────────────────────────────────
# GuideML — pytest configuration
# Run all tests:   pytest
# Run unit only:   pytest tests/unit/
# Run integration: pytest tests/integration/
# Run with cover: pytest --cov=core_recommender --cov-report=term-missing
# ──────────────────────────────────────────────────────────────

testpaths = tests

# Verbosity: -v shows each test name; remove for minimal output
addopts =
    --tb=short
    -v

# Marks to prevent "unknown mark" warnings
markers =
    unit: Unit tests (no I/O, no network)
    integration: Integration tests (disk I/O, Flask client)
    slow: Tests that take > 30 s

# Show locals on failure
# addopts = --tb=long -v -l

# Minimum version guard
minversion = 7.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
    ignore::RuntimeWarning
